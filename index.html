<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>微光雷達｜AI 升溫雷達榜 + 線索包 + 聲音回流</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ink:#1a1a1a;--muted:#666;--primary:#0066cc;--primary-h:#0052a3;--bg:#fafafa;--card:#fff;--border:#e0e0e0;--pv:#e8f5e9;--pv-t:#2e7d32;--warn:#fff3e0;--warn-t:#e65100;--danger:#d00;--ok:#2e7d32}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--warn);color:var(--warn-t)}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);font-size:.8rem;cursor:pointer}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
main{padding:16px;max-width:1000px;margin:0 auto;width:100%}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600}
.tag-pv{background:var(--pv);color:var(--pv-t)}
.badge-ai{font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:3px;background:var(--warn);color:var(--warn-t);margin-left:6px}
.rank-badge{width:36px;height:36px;border-radius:8px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:#666;flex-shrink:0}
.rank-1{background:#fff3e0;color:#e65100}.rank-2{background:#fce4ec;color:#c2185b}.rank-3{background:#f3e5f5;color:#7b1fa2}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.title-row{font-weight:600;font-size:1rem;margin-bottom:4px;word-break:break-word}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.meta span{display:flex;align-items:center;gap:4px}
.score{font-weight:700;color:var(--primary)}
.bar-wrap{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin-top:6px}
.bar{height:100%;background:linear-gradient(90deg,#ffb300,#ff8f00);border-radius:3px}
.kw-list{display:flex;flex-wrap:wrap;gap:6px}
.kw{background:#f0f0f0;padding:4px 10px;border-radius:999px;font-size:.85rem}
.angle{background:#fffbe6;border-left:3px solid #ffb300;padding:10px 12px;margin:8px 0;border-radius:0 6px 6px 0}
.source{background:#f5f5f5;padding:10px 12px;margin:8px 0;border-radius:6px}
.ai-note{font-size:.8rem;color:var(--muted);margin-top:8px}
.section{margin-top:16px}
.section h3{font-size:.95rem;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:.85rem;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-h)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;padding:40px;color:var(--muted)}
footer{text-align:center;padding:16px;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);background:#fff}
.fb-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:560px}
.fb-label{display:block;font-weight:600;margin-bottom:8px;font-size:.9rem}
.fb-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:.95rem;margin-bottom:12px}
.fb-textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:.95rem;font-family:inherit;resize:vertical;line-height:1.5;margin-bottom:8px}
.fb-count{text-align:right;font-size:.7rem;color:var(--muted);margin-bottom:12px}
.fb-btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--primary);color:#fff}
.fb-btn:disabled{background:#ccc}
.fb-msg{padding:10px 12px;border-radius:8px;margin-top:12px;display:none}
.fb-ok{background:#e8f5e9;color:var(--ok);border:1px solid #c8e6c9;display:block}
.fb-err{background:#fdecea;color:var(--danger);border:1px solid #f8bdbd;display:block}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#f5f5f5;padding:10px;border-radius:8px}
.stat-label{font-size:.7rem;color:var(--muted);margin-bottom:2px}
.stat-value{font-weight:700;font-size:1.05rem}
.loading{padding:30px;text-align:center;color:var(--muted)}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>

<header>
  <h1>微光雷達 <span class="badge">Beta</span></h1>
  <nav class="nav" aria-label="功能分頁">
    <button class="tab active" id="tab-radar" onclick="switchTab('radar')">📡 升溫雷達榜</button>
    <button class="tab" id="tab-detail" onclick="switchTab('detail')">📋 線索工作包</button>
    <button class="tab" id="tab-feedback" onclick="switchTab('feedback')">🗣️ 聲音回流</button>
  </nav>
</header>

<main>
  <!-- ===== 視圖 1：升溫雷達榜 ===== -->
  <section id="v-radar" class="view active">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
      <label style="font-size:.8rem">日期 <select id="dateSel" onchange="changeDate(this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff"></select></label>
      <label style="font-size:.8rem">類型 <select id="typeSel" onchange="changeType(this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff"><option value="">全部</option><option value="pv">公共價值</option><option value="general">一般</option></select></label>
      <span id="radarStats" style="margin-left:auto;font-size:.75rem;color:var(--muted)"></span>
    </div>
    <div id="radarList"></div>
  </section>

  <!-- ===== 視圖 2：線索工作包 ===== -->
  <section id="v-detail" class="view">
    <div style="margin-bottom:12px;font-size:.8rem;color:var(--muted)">
      從雷達榜點選「開啟線索包」，或在下方選擇議題：
      <select id="detailSel" onchange="openDetail(this.value)" style="margin-left:8px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:#fff"></select>
    </div>
    <div id="detailWrap"><div class="empty">請先在「升溫雷達榜」點選議題，或上方下拉選單選擇</div></div>
  </section>

  <!-- ===== 視圖 3：聲音回流 ===== -->
  <section id="v-feedback" class="view">
    <article class="fb-card">
      <h2 style="margin:0 0 6px;font-size:1.05rem">聲音回流</h2>
      <p style="margin:0 0 16px;color:var(--muted)">這個議題你有感嗎？一句話讓記者看見民眾聲音</p>
      <form id="fbForm" onsubmit="submitFeedback(event)">
        <label class="fb-label" for="fbTopic">選擇議題</label>
        <select id="fbTopic" class="fb-select" required><option value="">請選擇…</option></select>
        <label class="fb-label" for="fbVoice">你的聲音（200 字內）</label>
        <textarea id="fbVoice" class="fb-textarea" maxlength="200" placeholder="例：我家附近都更案已拖 5 年，老屋滲水没人管，希望媒體關注…" required></textarea>
        <div class="fb-count"><span id="fbCount">0</span> / 200 字</div>
        <button type="submit" class="fb-btn" id="fbBtn">送出回饋</button>
      </form>
      <div id="fbOk" class="fb-msg fb-ok">✅ 送出成功！感謝你的聲音，已匯入記者線索清單</div>
      <div id="fbErr" class="fb-msg fb-err">❌ 送出失敗，請重試</div>
      <p style="font-size:.7rem;color:var(--muted);margin-top:12px;text-align:center">※ 回饋將以 CSV 形式儲存，僅供記者選題參考，不公開個人資訊</p>
    </article>
  </section>
</main>

<footer>
  微光雷達｜2026 永續智慧創新黑客松｜資料：PTT、YouTube、Google Trends（合規公開資料）｜
  <a href="#" onclick="downloadFeedbackCSV();return false" style="color:var(--primary)">下載回饋 CSV</a>
</footer>

<script>
// ========== 1. 資料（多日排名，由 gen_rank_data.py 產出） ==========
const RANK_DATA = {
 "2026/11/01": [],
 "2026/11/02": [],
 "2026/11/03": [],
 "2026/11/04": [],
 "2026/11/05": [
  {
   "group": "都更危老",
   "score": 0.0,
   "today": 1,
   "last3": 1,
   "growth": 0,
   "pv": true,
   "sample": "Re: [新聞] 藍營酸沈伯洋「無餡」都更！張景森提10大"
  },
  {
   "group": "AI 科技",
   "score": 0.0,
   "today": 1,
   "last3": 1,
   "growth": 0,
   "pv": false,
   "sample": "[討論] 美國民主黨不要AI,那美國怎麼發展經濟?"
  },
  {
   "group": "房市政策",
   "score": 0.0,
   "today": 1,
   "last3": 1,
   "growth": 0,
   "pv": false,
   "sample": "[討論] 立場深藍的，很難討論房價"
  }
 ],
 "2026/11/06": [
  {
   "group": "都更危老",
   "score": 12.49,
   "today": 4,
   "last3": 5,
   "growth": 2700,
   "pv": true,
   "sample": "[新聞] 沈伯洋無限都更6步驟曝光!老屋住戶可換屋"
  },
  {
   "group": "房市政策",
   "score": 8.98,
   "today": 3,
   "last3": 4,
   "growth": 2000,
   "pv": false,
   "sample": "[請益] 一堆人哭暈在廁所 是不是房價利多？"
  }
 ],
 "2026/11/07": [
  {
   "group": "都更危老",
   "score": 10.15,
   "today": 11,
   "last3": 16,
   "growth": 1440,
   "pv": true,
   "sample": "Re: [新聞] 沈伯洋無限都更6步驟曝光!老屋住戶可換屋"
  },
  {
   "group": "AI 科技",
   "score": 3.88,
   "today": 3,
   "last3": 6,
   "growth": 600,
   "pv": false,
   "sample": "Re: [問卦] 為啥東方人接受AI比西方人快？"
  },
  {
   "group": "租屋居住",
   "score": 0,
   "today": 0,
   "last3": 0,
   "growth": 0,
   "pv": true,
   "sample": ""
  },
  {
   "group": "長照高齡",
   "score": 0,
   "today": 1,
   "last3": 1,
   "growth": 0,
   "pv": true,
   "sample": "[問卦] 台灣老人向外勞與黑人乞討要錢"
  },
  {
   "group": "兒少家庭",
   "score": 0,
   "today": 2,
   "last3": 2,
   "growth": 0,
   "pv": true,
   "sample": "[問卦] 幼稚園+才藝班 一年花60萬 算多還是少?"
  },
  {
   "group": "交通安全",
   "score": 0,
   "today": 0,
   "last3": 1,
   "growth": 0,
   "pv": true,
   "sample": "[問卦] ☺  為什麼韓國正妹覺得捷運很臭？"
  },
  {
   "group": "電價能源",
   "score": 0,
   "today": 0,
   "last3": 0,
   "growth": 0,
   "pv": false,
   "sample": ""
  },
  {
   "group": "房市政策",
   "score": 0,
   "today": 1,
   "last3": 5,
   "growth": 0,
   "pv": false,
   "sample": "[新聞] 捷克央行升息1碼至4%　防範通膨升溫、經"
  }
 ]
};

// ========== 2. 知識庫（關鍵字 / 切角 / 訪問對象） ==========
const KNOWLEDGE = {
  "都更危老":{keywords:["都更","危老","重建","容積","建蔽","無限都更","門檻"],angles:["老屋住戶「換屋不換人」能否落地？","都更門檻降至 50% 後，誰來蓋？","無限都更是否只是選前支票？"],sources:["都市更新業者、都市計畫委員、老屋住戶代表、都發局官員"]},
  "AI 科技":{keywords:["AI","人工智慧","ChatGPT","機器人","晶片","生成式AI"],angles:["台灣 AI 人才缺口有多大？","生成式 AI 讓哪些職位先消失？","政府 AI 預算流向哪裡？"],sources:["產學界 AI 研究者、受影響產業從業者、數發部官員"]},
  "交通安全":{keywords:["酒駕","行人","地雷","交通事故","肇逃","捷運"],angles:["酒駕重罰後死亡率是否下降？","行人天橋與地下道誰來管？","捷運延遲對通勤族的隱形成本"],sources:["交通部專家、酒駕受害者家屬、捷運局工程師"]},
  "長照高齡":{keywords:["長照","老人","高齡","照護","失智","安養","虐老"],angles:["長照機構檢查機制為何失靈？","失智友善社區推展進度？","外籍看護工權益保障現況"],sources:["長照機構負責人、失智照顧者家屬、衛福部長照司"]},
  "租屋居住":{keywords:["租屋","房租","押金","房東","租約","社會宅"],angles:["租屋合約版本統一化進度？","房東任意漲租法律救濟？","社會宅分配公平性？"],sources:["租屋權益團體、不動產仲介、內政部營建署"]},
  "兒少家庭":{keywords:["兒少","幼兒","托育","幼稚園","營養午餐","霸凌"],angles:["營養午餐標準為何十年不變？","托育缺額地圖在哪裡？","霸凌通報後處理流程透明度"],sources:["教育部國教署、營養師公會、家長會代表"]},
  "電價能源":{keywords:["電價","台電","核電","光電","漲價","能源"],angles:["電價調漲對產業鏈衝擊？","核廢料最終置放方案？","再生能源佔比能否達標？"],sources:["台電董事、經發會委員、綠能業者"]},
  "房市政策":{keywords:["房價","打炒房","囤房","房貸","升息","實價登錄"],angles:["打炒房新政實施半年成效？","實價登錄 2.0 上路時間？","青年安心成屋實際獲配率"],sources:["金管會官員、建商公會、不動產經紀人"]}
};

// ========== 3. 狀態 ==========
let currentDate = "";
let currentType = "";
let currentDetailGroup = "";

// ========== 4. 工具 ==========
const $ = id => document.getElementById(id);
const TOPICS = Object.keys(KNOWLEDGE);
const ESC = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function switchTab(name){
  ["radar","detail","feedback"].forEach(n=>{
    const v = $("v-"+n), t = $("tab-"+n);
    if(v) v.classList.toggle("active", n===name);
    if(t) t.classList.toggle("active", n===name);
  });
}

// ========== 5. 雷達榜 ==========
function changeDate(v){ currentDate = v; renderRadar(); }
function changeType(v){ currentType = v; renderRadar(); }

function currentList(){
  const all = RANK_DATA[currentDate] || [];
  return all.filter(d=>{
    if(currentType==="pv" && !d.pv) return false;
    if(currentType==="general" && d.pv) return false;
    return true;
  });
}

function renderRadar(){
  const data = currentList();
  const all = RANK_DATA[currentDate] || [];
  const pvCount = all.filter(d=>d.pv).length;
  $("radarStats").textContent = `共 ${data.length} 筆｜公共價值 ${pvCount} 筆｜${currentDate}`;
  if(!data.length){ $("radarList").innerHTML = '<div class="empty">此條件下無資料</div>'; return; }
  $("radarList").innerHTML = data.map((d,i)=>`
    <article class="card">
      <div class="row">
        <div class="rank-badge ${i<3?'rank-'+(i+1):''}">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div class="title-row">${ESC(d.group)} ${d.pv?'<span class="tag tag-pv">公共價值</span>':''}</div>
          <div class="meta">
            <span>🔥 升溫分 <strong class="score">${d.score}</strong></span>
            <span>📊 今日 ${d.today} 篇</span>
            <span>📈 近 3 日 ${d.last3} 篇</span>
            <span>📉 成長 ${d.growth}%</span>
          </div>
          <div class="bar-wrap"><div class="bar" style="width:${Math.min(d.score/13*100,100)}%"></div></div>
          <div class="actions">
            <button class="btn btn-sm" onclick="openDetail('${ESC(d.group)}')">開啟線索包</button>
            <button class="btn btn-sm btn-primary" onclick="aiGenerate('${ESC(d.group)}')"><span class="badge-ai">AI</span> 產出線索包</button>
          </div>
        </div>
      </div>
    </article>`).join("");
}

// ========== 6. 線索工作包 ==========
function openDetail(group){
  if(!group) return;
  currentDetailGroup = group;
  switchTab("detail");
  $("detailSel").value = group;
  renderDetail(group, false);
}

// AI 產出線索包：先顯示生成過程，再出現完整內容
function aiGenerate(group){
  if(!group) return;
  currentDetailGroup = group;
  switchTab("detail");
  $("detailSel").value = group;
  $("detailWrap").innerHTML = `<div class="card loading"><span class="spinner"></span>AI 正在分析「${ESC(group)}」的關鍵字、切角與訪問對象…</div>`;
  setTimeout(()=>renderDetail(group, true), 900);
}

function renderDetail(group, isAI){
  const list = RANK_DATA[currentDate] || [];
  const d = list.find(x=>x.group===group) || {group:group,score:0,today:0,last3:0,growth:0,pv:false,sample:""};
  const k = KNOWLEDGE[group] || {keywords:[],angles:[],sources:[]};
  const rank = list.findIndex(x=>x.group===group)+1;
  const rankBadge = rank>0 ? `<div class="rank-badge ${rank<4?'rank-'+rank:''}">${rank}</div>` : "";
  const aiTag = isAI ? '<span class="badge-ai">AI 生成</span>' : "";

  $("detailWrap").innerHTML = `<article class="card">
    <div class="row">
      ${rankBadge}
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
          <span class="title-row">${ESC(group)}</span>${aiTag}
          ${d.pv?'<span class="tag tag-pv">公共價值</span>':''}
        </div>
        <div style="color:var(--muted);font-size:.9rem">${ESC(d.sample||"（今日無樣本標題）")}</div>
      </div>
    </div>
    <div class="grid-4">
      <div class="stat"><div class="stat-label">升溫分</div><div class="stat-value">${d.score}</div></div>
      <div class="stat"><div class="stat-label">今日篇數</div><div class="stat-value">${d.today} 篇</div></div>
      <div class="stat"><div class="stat-label">近 3 日</div><div class="stat-value">${d.last3} 篇</div></div>
      <div class="stat"><div class="stat-label">成長幅度</div><div class="stat-value">${d.growth}%</div></div>
    </div>
    <div class="section"><h3>推薦關鍵字群組</h3>
      <div class="kw-list">${k.keywords.map(w=>`<span class="kw">${ESC(w)}</span>`).join("")}</div>
    </div>
    <div class="section"><h3>建議切入角度 ${aiTag}</h3>
      <div>${k.angles.map(a=>`<div class="angle">• ${ESC(a)}</div>`).join("")}</div>
      <p class="ai-note">※ 以上由 LLM 依議題關鍵字自動生成，供記者參考發掘，請自行判斷核實</p>
    </div>
    <div class="section"><h3>建議訪問對象</h3>
      <div>${k.sources.map(s=>`<div class="source">${ESC(s)}</div>`).join("")}</div>
    </div>
    <div style="margin-top:16px;text-align:center">
      <button class="btn btn-primary" onclick="goFeedback('${ESC(group)}')">我有感，想回饋給記者 →</button>
    </div>
  </article>`;
}

function goFeedback(group){
  switchTab("feedback");
  $("fbTopic").value = group;
}

// ========== 7. 聲音回流 ==========
function submitFeedback(e){
  e.preventDefault();
  const topic = $("fbTopic").value, voice = $("fbVoice").value.trim();
  if(!topic){ alert("請選擇議題"); return; }
  if(!voice){ alert("請輸入你的聲音"); return; }
  const btn = $("fbBtn"); btn.disabled = true; btn.textContent = "送出中…";
  $("fbOk").style.display = "none"; $("fbErr").style.display = "none";
  const row = { time:new Date().toISOString().replace("T"," ").slice(0,19), topic, voice:voice.replace(/\n/g," ") };
  setTimeout(()=>{
    downloadCSV(row);
    $("fbOk").style.display = "block";
    $("fbForm").reset();
    $("fbCount").textContent = "0";
    btn.disabled = false; btn.textContent = "送出回饋";
    setTimeout(()=>{ $("fbOk").style.display = "none"; }, 4000);
  }, 400);
}

function downloadCSV(newRow){
  fetch("feedback.csv").then(r=>r.ok?r.text():"").catch(()=>"").then(text=>{
    const rows = text ? text.trim().split("\n") : ["時間,議題,聲音"];
    if(newRow && newRow.topic) rows.push(`${newRow.time},${newRow.topic},"${newRow.voice}"`);
    const blob = new Blob(["\ufeff"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "feedback.csv"; a.click();
    URL.revokeObjectURL(url);
  });
}
function downloadFeedbackCSV(){ downloadCSV(null); }

// ========== 8. 啟動 ==========
document.addEventListener("DOMContentLoaded", ()=>{
  const dates = Object.keys(RANK_DATA).sort().reverse().filter(d=>(RANK_DATA[d]||[]).length>0);
  if(!dates.length){ $("radarList").innerHTML = '<div class="empty">無資料</div>'; return; }
  currentDate = dates[0];
  $("dateSel").innerHTML = dates.map(d=>`<option value="${d}">${d}</option>`).join("");
  $("detailSel").innerHTML = '<option value="">請選擇議題…</option>' + TOPICS.map(t=>`<option value="${ESC(t)}">${ESC(t)}</option>`).join("");
  $("fbTopic").innerHTML = '<option value="">請選擇…</option>' + TOPICS.map(t=>`<option value="${ESC(t)}">${ESC(t)}</option>`).join("");
  $("fbVoice").addEventListener("input", ()=>{ $("fbCount").textContent = $("fbVoice").value.length; });
  renderRadar();
});
</script>
