// ========== 3. 狀態 ==========
let currentDate = "";
let currentType = "";
let currentMode = "warm";   // warm=升溫（z-score）｜heat=熱度（當日篇數）
let currentDetailGroup = "";

// ========== 4. 工具 ==========
const $ = id => document.getElementById(id);
const TOPICS = Object.keys(KNOWLEDGE);
const ESC = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function switchTab(name, push){
  if(push === undefined) push = true;
  const cur = document.querySelector(".view.active");
  if(cur && cur.id === "v-"+name){ updateBackBtn(name); return; }
  ["radar","detail","feedback"].forEach(n=>{
    const v = $("v-"+n), t = $("tab-"+n);
    if(v) v.classList.toggle("active", n===name);
    if(t) t.classList.toggle("active", n===name);
  });
  // 寫入歷史紀錄 → 滑鼠側鍵 / 瀏覽器返回鍵可退回上一個分頁
  if(push && history.pushState){
    history.pushState({tab:name, app:true}, "", "#"+name);
    inAppDepth++;
  }
  updateBackBtn(name);
  window.scrollTo(0, 0);
}

function updateBackBtn(name){
  const show = (name !== "radar");   // 首頁不顯示返回鍵
  const b = $("backBtn");
  if(b) b.style.display = show ? "" : "none";
}

// 返回：只在「站內分頁歷史」內退回；沒有站內歷史時回首頁分頁，絕不跳出網站
let inAppDepth = 0;   // 站內已推入的歷史筆數
function goBack(){
  if(inAppDepth > 0){ history.back(); }
  else{ switchTab("radar"); }
}

// 瀏覽器返回鍵 / 滑鼠側鍵（Alt+←）觸發時，回到對應分頁
window.addEventListener("popstate", e=>{
  if(inAppDepth > 0) inAppDepth--;
  const name = (e.state && e.state.tab) || (location.hash || "#radar").replace("#","");
  const safe = ["radar","detail","feedback"].includes(name) ? name : "radar";
  switchTab(safe, false);
});

// ========== 5. 雷達榜 ==========
function changeDate(v){ currentDate = v; renderRadar(); }
function changeType(v){ currentType = v; renderRadar(); }
function changeMode(v){ currentMode = v; renderRadar(); }

// 依模式回傳榜單資料（warm=只留升溫達標並依分數排；heat=全部並依當日篇數排）
function rankedList(){
  const all = currentList();
  if(currentMode === "heat"){
    return all.slice().sort((a,b)=>(b.today||0)-(a.today||0));
  }
  return all.filter(d=>d.score>0).sort((a,b)=>b.score-a.score);
}

function currentList(){
  const all = RANK_DATA[currentDate] || [];
  return all.filter(d=>{
    if(currentType==="pv" && !d.pv) return false;
    if(currentType==="general" && d.pv) return false;
    return true;
  });
}

function renderRadar(){
  const all = currentList();
  const data = rankedList();                           // 依模式排序後的榜單
  const isHeat = currentMode === "heat";
  const below = all.length - data.length;              // 升溫模式：未達標數量（熱度模式恆為 0）
  const pvCount = all.filter(d=>d.pv).length;
  const barVal = d => isHeat ? (d.today||0) : d.score; // 長條圖數值依模式
  const maxVal = Math.max(...data.map(barVal), 1);     // 長條圖以當日最高值為滿版
  $("radarStats").textContent = isHeat
    ? `熱度榜 ${data.length} 筆｜公共價值 ${pvCount} 筆｜${currentDate}`
    : `上榜 ${data.length} 筆｜未達標 ${below} 筆｜公共價值 ${pvCount} 筆｜${currentDate}`;
  if(!data.length){
    $("radarList").innerHTML = isHeat
      ? `<div class="empty">此日期無討論資料</div>`
      : `<div class="empty">此日期無達標議題（今日討論量未達升溫門檻）<br><span style="font-size:.8rem">門檻：單日 ≥3 篇且高於過去 7 天基期</span><br><span style="font-size:.8rem">可切換「📊 熱度」模式查看當日討論量排名</span></div>`;
    return;
  }
  $("radarList").innerHTML = data.map((d,i)=>`
    <article class="card">
      <div class="row">
        <div class="rank-badge ${i<3?'rank-'+(i+1):''}">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div class="title-row">${ESC(d.group)} ${d.pv?'<span class="tag tag-pv">公共價值</span>':''}
            <span class="tag" style="background:#e3f2fd;color:#1565c0">⏱ 領先 ${d.lead} 天</span>
          </div>
          <div class="meta">
            <span>${isHeat ? '📊 當日' : '🔥 升溫分'} <strong class="score">${isHeat ? d.today+' 篇' : d.score}</strong></span>
            <span>📊 今日 ${d.today} 篇</span>
            <span>📈 近 3 日 ${d.last3} 篇</span>
            <span>📉 成長 ${growthText(d)}</span>
          </div>
          <div class="meta" style="margin-bottom:4px">
            <span>📡 來源分佈：PTT ${d.sources.ptt} ｜ YouTube ${d.sources.yt}</span>
          </div>
          <div class="bar-wrap"><div class="bar" style="width:${Math.max(barVal(d)/maxVal*100,4)}%"></div></div>
          <div class="actions">
            <button class="btn btn-sm" onclick="openDetail('${ESC(d.group)}')">開啟線索包</button>
            <button class="btn btn-sm btn-primary" onclick="copyPack('${ESC(d.group)}')">📋 一鍵複製線索包</button>
          </div>
        </div>
      </div>
    </article>`).join("");
}

// 成長%：基期過低時不顯示誇大數字（避免 1440% 這種失真數據）
function growthText(d){
  if(d.baseline < 1) return "基期過低（新起議題）";
  return d.growth + "%";
}

// ========== 6. 線索工作包 ==========
function openDetail(group){
  if(!group) return;
  currentDetailGroup = group;
  switchTab("detail");
  $("detailSel").value = group;
  renderDetail(group);
}

// 一鍵複製線索包：把該議題的完整線索包轉成純文字，複製到剪貼簿
function copyPack(group){
  const list = rankedList();
  const d = list.find(x=>x.group===group) || (RANK_DATA[currentDate]||[]).find(x=>x.group===group) || {score:0,today:0,last3:0,growth:0,lead:0,baseline:0,pv:false,sample:"",sources:{ptt:0,yt:0},links:[]};
  const k = KNOWLEDGE[group] || {keywords:[],angles:[],sources:[]};
  const rank = list.findIndex(x=>x.group===group)+1;
  const text = [
    `【微光雷達 線索包】${group}（${currentDate}）`,
    rank>0 ? `排名 #${rank}｜` : "",
    `升溫分 ${d.score}｜今日 ${d.today} 篇｜近3日 ${d.last3} 篇｜領先 ${d.lead||0} 天`,
    `來源分佈：PTT ${(d.sources||{}).ptt||0} ｜ YouTube ${(d.sources||{}).yt||0}`,
    d.pv ? "公共價值議題" : "",
    d.sample ? `樣本標題：${d.sample}` : "",
    ...((d.links||[]).length ? ["", "原始出處：", ...d.links.map(l=>`  ${l.url}`)] : []),
    "",
    `關鍵字：${k.keywords.join("、")}`,
    "建議切入角度（AI 生成，請自行核實）：",
    ...k.angles.map(a=>`  • ${a}`),
    `建議訪問對象：${k.sources.join("、")}`,
    "",
    "資料來源：PTT 公開資料、YouTube Data API｜產出：微光雷達（2026 永續智慧創新黑客松）",
  ].filter(x=>x!==undefined&&x!=="").join("\n");

  const done = ()=>{
    alert(`✅ 已複製「${group}」線索包（含關鍵字、3 個切角、訪問對象）\n可直接貼到採訪筆記或 Word。`);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else{
    fallbackCopy(text,done);
  }
}
function fallbackCopy(text,done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }
  catch(e){ alert("複製失敗，請手動選取內容"); }
  document.body.removeChild(ta);
}

function renderDetail(group){
  const list = rankedList();
  const d = list.find(x=>x.group===group) || (RANK_DATA[currentDate]||[]).find(x=>x.group===group) || {group:group,score:0,today:0,last3:0,growth:0,baseline:0,lead:0,pv:false,sample:"",sources:{ptt:0,yt:0},links:[],trend:[]};
  const k = KNOWLEDGE[group] || {keywords:[],angles:[],sources:[]};
  const rank = list.findIndex(x=>x.group===group)+1;
  const rankBadge = rank>0 ? `<div class="rank-badge ${rank<4?'rank-'+rank:''}">${rank}</div>` : "";
  const s = d.sources || {ptt:0,yt:0};
  const linksHtml = (d.links && d.links.length)
    ? d.links.map(l=>`<div class="source"><a href="${ESC(l.url)}" target="_blank" rel="noopener">🔗 ${ESC(l.title)}</a></div>`).join("")
    : `<div class="source" style="color:var(--muted)">此日期無原始連結</div>`;
  const trendHtml = (d.trend && d.trend.length)
    ? `<div class="trend-wrap">${d.trend.map((v,idx)=>{
        const max = Math.max(...d.trend, 1);
        return `<div class="trend-bar" title="第 ${idx+1} 天：${v} 篇" style="height:${Math.max(v/max*100,3)}%"></div>`;
      }).join("")}</div><p class="ai-note">近 14 天每日討論量（左→右為舊→新），末段陡升即為「升溫」訊號</p>`
    : "";
  // 摘要：依當日數據自動組成（規則式，非 LLM）
  const summary = rank>0
    ? `${group} 於 ${currentDate} 升溫分 ${d.score}（榜上第 ${rank} 名），當日 PTT 討論 ${s.ptt} 篇、YouTube 留言 ${s.yt} 則，近 3 日累計 ${d.last3} 篇，已連續 ${d.lead} 天達升溫門檻；相較過去 7 天基期（日均 ${d.baseline} 篇）顯著成長。${d.pv ? "本議題屬公共價值類別，低流量但影響深遠。" : "本議題屬一般討論類別。"}`
    : `${group} 於 ${currentDate} 未達升溫門檻（單日需 ≥3 篇），無榜上排名。`;

  $("detailWrap").innerHTML = `<article class="card">
    <div class="row">
      ${rankBadge}
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
          <span class="title-row">${ESC(group)}</span>
          ${d.pv?'<span class="tag tag-pv">公共價值</span>':''}
        </div>
        <div style="color:var(--muted);font-size:.9rem">${ESC(d.sample||"（今日無樣本標題）")}</div>
      </div>
    </div>
    <div class="grid-4">
      <div class="stat"><div class="stat-label">升溫分</div><div class="stat-value">${d.score}</div></div>
      <div class="stat"><div class="stat-label">今日篇數</div><div class="stat-value">${d.today} 篇</div></div>
      <div class="stat"><div class="stat-label">近 3 日</div><div class="stat-value">${d.last3} 篇</div></div>
      <div class="stat"><div class="stat-label">領先天數</div><div class="stat-value">${d.lead} 天</div></div>
    </div>
    <div class="meta" style="margin-top:8px">
      <span>📡 來源分佈：PTT ${s.ptt} ｜ YouTube ${s.yt}</span>
      <span>📉 成長 ${growthText(d)}</span>
    </div>

    <div class="section"><h3>摘要 <span class="badge-ai">自動生成</span></h3>
      <div class="angle">${ESC(summary)}</div>
      <p class="ai-note">※ 由系統依當日數據自動組成，數字皆來自實際爬取資料</p>
    </div>

    <div class="section"><h3>趨勢時間軸（近 14 天）</h3>
      ${trendHtml || '<div class="source" style="color:var(--muted)">無趨勢資料</div>'}
    </div>

    <div class="section"><h3>來源連結（原始出處）</h3>
      ${linksHtml}
      <p class="ai-note">※ 點連結可直接開啟 PTT 原文，供記者查證與引用</p>
    </div>

    <div class="section"><h3>推薦關鍵字群組</h3>
      <div class="kw-list">${k.keywords.map(w=>`<span class="kw">${ESC(w)}</span>`).join("")}</div>
    </div>
    <div class="section"><h3>建議切入角度 <span class="badge-ai">AI 生成</span></h3>
      <div>${k.angles.map(a=>`<div class="angle">• ${ESC(a)}</div>`).join("")}</div>
      <p class="ai-note">※ 本原型以規則式模板產生候選切角，正式版將串接 LLM 依原文即時生成；請記者自行判斷核實</p>
    </div>
    <div class="section"><h3>建議訪問對象</h3>
      <div>${k.sources.map(s=>`<div class="source">${ESC(s)}</div>`).join("")}</div>
    </div>
    <div style="margin-top:16px;text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn" onclick="copyPack('${ESC(group)}')">📋 複製線索包</button>
      <button class="btn btn-primary" onclick="goFeedback('${ESC(group)}')">我有感，想回饋給記者 →</button>
    </div>
  </article>`;
}

function goFeedback(group){
  switchTab("feedback");
  $("fbTopic").value = group;
}

// ========== 7. 聲音回流 ==========
// Apps Script 後端網址（讀者回饋會寫入 Google 試算表的「回饋」分頁）
const FEEDBACK_API = "https://script.google.com/macros/s/AKfycbyIeH8C82QJGt53WiVU59R2bJ1pQmfmdreP7-tpgAm5GjbOesos2XzzL3xctIj6GNpw/exec";

// 手動更新：請 Apps Script 去觸發 GitHub Actions 的每日更新排程
function manualUpdate(){
  const btn = $("manualUpdateBtn"), msg = $("manualUpdateMsg");
  if(btn.disabled) return;
  btn.disabled = true; btn.textContent = "🔄 觸發中…";
  msg.textContent = "";
  fetch(`${FEEDBACK_API}?action=trigger`).then(r=>r.json()).then(d=>{
    msg.textContent = d.ok ? "✅ " + d.msg : "⚠️ " + (d.msg || "觸發失敗");
    msg.style.color = d.ok ? "var(--primary)" : "#c0392b";
    btn.textContent = "🔄 手動更新";
  }).catch(()=>{
    msg.textContent = "❌ 無法連線，請重試";
    msg.style.color = "#c0392b";
    btn.textContent = "🔄 手動更新";
  }).finally(()=>{ btn.disabled = false; });
}

function submitFeedback(e){
  e.preventDefault();
  const topic = $("fbTopic").value, voice = $("fbVoice").value.trim();
  if(!topic){ alert("請選擇議題"); return; }
  if(!voice){ alert("請輸入你的聲音"); return; }
  const btn = $("fbBtn"); btn.disabled = true; btn.textContent = "送出中…";
  $("fbOk").style.display = "none"; $("fbErr").style.display = "none";
  const time = new Date().toISOString().replace("T"," ").slice(0,19);
  // 用 GET 參數送到 Apps Script（寫入 Google 試算表）
  const params = new URLSearchParams({ time, topic, voice: voice.replace(/\n/g," "), source: "website" });
  fetch(`${FEEDBACK_API}?${params}`).then(r=>r.json()).then(d=>{
    if(d.ok){
      $("fbOk").style.display = "block";
      $("fbForm").reset();
      $("fbCount").textContent = "0";
      setTimeout(()=>{ $("fbOk").style.display = "none"; }, 4000);
    } else {
      $("fbErr").style.display = "block";
      setTimeout(()=>{ $("fbErr").style.display = "none"; }, 4000);
    }
  }).catch(()=>{
    $("fbErr").style.display = "block";
    setTimeout(()=>{ $("fbErr").style.display = "none"; }, 4000);
  }).finally(()=>{
    btn.disabled = false; btn.textContent = "送出回饋";
  });
}

function downloadCSV(newRow){
  fetch("feedback.csv").then(r=>r.ok?r.text():"").catch(()=>"").then(text=>{
    const rows = text ? text.trim().split("\n") : ["時間,議題,聲音"];
    if(newRow && newRow.topic) rows.push(`${newRow.time},${newRow.topic},"${newRow.voice}"`);
    const blob = new Blob(["\ufeff"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "feedback.csv"; a.click();
    URL.revokeObjectURL(url);
  });
}
function downloadFeedbackCSV(){ downloadCSV(null); }

// ========== 8. 啟動 ==========
document.addEventListener("DOMContentLoaded", ()=>{
  const allDates = Object.keys(RANK_DATA).sort().reverse().filter(d=>(RANK_DATA[d]||[]).length>0);
  // 預設日期 = 最近一個「有達標議題」的日子（避免清晨跑完資料未齊時開站是空榜）
  const dates = allDates.filter(d=>(RANK_DATA[d]||[]).some(x=>x.score>0));
  const showDates = dates.length ? dates : allDates;
  if(!showDates.length){ $("radarList").innerHTML = '<div class="empty">無資料</div>'; return; }
  currentDate = showDates[0];
  $("dateSel").innerHTML = allDates.map(d=>`<option value="${d}">${d}</option>`).join("");
  $("dateSel").value = currentDate;
  $("detailSel").innerHTML = '<option value="">請選擇議題…</option>' + TOPICS.map(t=>`<option value="${ESC(t)}">${ESC(t)}</option>`).join("");
  $("fbTopic").innerHTML = '<option value="">請選擇…</option>' + TOPICS.map(t=>`<option value="${ESC(t)}">${ESC(t)}</option>`).join("");
  $("fbVoice").addEventListener("input", ()=>{ $("fbCount").textContent = $("fbVoice").value.length; });
  // 支援 #detail / #feedback 直接開啟（分享連結用）
  const hash = (location.hash || "").replace("#","");
  if(["detail","feedback"].includes(hash)){
    switchTab(hash, false);
    if(hash === "detail" && !currentDetailGroup) openDetail(TOPICS[0]);
  }
  renderRadar();
  updateBackBtn(document.querySelector(".view.active").id.replace("v-",""));
});
</script>
