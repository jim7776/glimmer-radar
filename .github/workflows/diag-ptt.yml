name: diag-proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 驗證 translate.goog 從雲端可用
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          probe () {
            NAME="$1"; FILE="$2"
            RENT=$(grep -c 'class="r-ent"' "$FILE" 2>/dev/null || true)
            S=$(wc -c < "$FILE" 2>/dev/null | tr -d ' ')
            echo "  [$NAME] size=$S r-ent=$RENT"
          }

          echo "=== A. Gossiping（限制級）經 translate ==="
          curl -s -m 40 -A "$UA" -o /tmp/a.html -w "http=%{http_code}\n" \
            "https://www-ptt-cc.translate.goog/bbs/Gossiping/index.html?_x_tr_sl=zh-TW&_x_tr_tl=en&_x_tr_hl=en"
          probe gossiping /tmp/a.html
          grep -oE 'href="[^"]*translate.goog[^"]*"' /tmp/a.html | head -3

          echo "=== B. 第 2 頁（驗證分頁） ==="
          curl -s -m 40 -A "$UA" -o /tmp/b.html -w "http=%{http_code}\n" \
            "https://www-ptt-cc.translate.goog/bbs/Gossiping/index2.html?_x_tr_sl=zh-TW&_x_tr_tl=en&_x_tr_hl=en"
          probe gossiping-p2 /tmp/b.html

          echo "=== C. home-sale 經 translate ==="
          curl -s -m 40 -A "$UA" -o /tmp/c.html -w "http=%{http_code}\n" \
            "https://www-ptt-cc.translate.goog/bbs/home-sale/index.html?_x_tr_sl=zh-TW&_x_tr_tl=en&_x_tr_hl=en"
          probe home-sale /tmp/c.html

          echo "=== D. WomenTalk（限制級）經 translate ==="
          curl -s -m 40 -A "$UA" -o /tmp/d.html -w "http=%{http_code}\n" \
            "https://www-ptt-cc.translate.goog/bbs/WomenTalk/index.html?_x_tr_sl=zh-TW&_x_tr_tl=en&_x_tr_hl=en"
          probe womentalk /tmp/d.html

          echo "=== E. 直連（對照，預期 403） ==="
          curl -s -m 20 -A "$UA" -o /dev/null -w "http=%{http_code}\n" "https://www.ptt.cc/bbs/Gossiping/index.html"
