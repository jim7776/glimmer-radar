name: diag-proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 驗證 jina 是否拿到真內容
        run: |
          TARGET="https://www.ptt.cc/bbs/Gossiping/index.html"
          HOME="https://www.ptt.cc/bbs/home-sale/index.html"

          dump () {
            NAME="$1"; FILE="$2"
            DATES=$(grep -oE "[0-9]{2}/[0-9]{2}" "$FILE" 2>/dev/null | wc -l | tr -d ' ')
            ART=$(grep -c "article-meta\|r-list__title\|\.entry" "$FILE" 2>/dev/null || true)
            NEWS=$(grep -c "\[新聞\]\|\[問卦\]\|\[閒聊\]" "$FILE" 2>/dev/null || true)
            SIZE=$(wc -c < "$FILE" | tr -d ' ')
            echo "[$NAME] size=$SIZE 日期筆數=$DATES 文章區塊=$ART 含文章標題=$NEWS"
            head -c 250 "$FILE" | tr '\n' ' '; echo ""; echo "==="
          }

          echo "=== A. jina markdown（無 cookie） ==="
          curl -s -m 40 -o /tmp/a.md -w "http=%{http_code}\n" "https://r.jina.ai/$TARGET"
          dump jina-md /tmp/a.md

          echo "=== B. jina markdown + over18 cookie ==="
          curl -s -m 40 -H "x-set-cookie: over18=1" -o /tmp/b.md -w "http=%{http_code}\n" "https://r.jina.ai/$TARGET"
          dump jina-md-cookie /tmp/b.md

          echo "=== C. jina HTML + cookie ==="
          curl -s -m 40 -H "x-set-cookie: over18=1" -H "x-respond-with: html" -o /tmp/c.html -w "http=%{http_code}\n" "https://r.jina.ai/$TARGET"
          dump jina-html-cookie /tmp/c.html

          echo "=== D. jina markdown 抓非限制級看板 home-sale ==="
          curl -s -m 40 -o /tmp/d.md -w "http=%{http_code}\n" "https://r.jina.ai/$HOME"
          dump jina-home /tmp/d.md

          echo "=== E. B 的前 800 字元（看是不是驗證頁） ==="
          head -c 800 /tmp/b.md
          echo ""
